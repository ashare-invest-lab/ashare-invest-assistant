  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: ${{ env.UV_VERSION }}
    - name: pip-audit（uv.lock 全部依赖组）
      shell: bash
      run: "set -euo pipefail\nuv export --project src/backend --frozen --all-groups --no-emit-project --format requirements.txt \\\n  -o \"${RUNNER_TEMP}/backend-requirements.txt\"\nuvx --from \"pip-audit==${PIP_AUDIT_VERSION}\" pip-audit --strict --progress-spinner off \\\n  -r \"${RUNNER_TEMP}/backend-requirements.txt\" --require-hashes --disable-pip\nif [ -f tests/requirements.txt ]; then\n  uvx --from \"pip-audit==${PIP_AUDIT_VERSION}\" pip-audit --strict --progress-spinner off -r tests/requirements.txt\nfi\n"
