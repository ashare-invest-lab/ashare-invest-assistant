# CI 质量门禁（plan.md §8.0、T-O02）。密钥与敏感信息扫描在 secret-scan.yml（T-O02a）。
# 所有第三方 action 按提交 SHA 固定（注释为对应版本）。
# CI 不访问真实麦蕊与真实 LLM：不配置麦蕊证书 / DEEPSEEK_API_KEY，不引用任何 secret，一律用 mock 或录制数据。
# 兜底：麦蕊基址指向本机不可达端口，万一有代码误发请求也只会连接失败，不会到达公网（scripts/ci/tests 有检查）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue requests must neither share PR groups nor replace pending queue runs.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAIRUI_BASE_URL: "http://127.0.0.1:9"
  MAIRUI_PRO_BASE_URL: "http://127.0.0.1:9"
  UV_VERSION: "0.13.6"
  UV_PYTHON: "3.13"
  UV_PYTHON_DOWNLOADS: automatic
  PYTEST_COV_VERSION: "7.1.0"
  PIP_AUDIT_VERSION: "2.10.1"
  SCHEMATHESIS_VERSION: "4.33.0"
  PYYAML_VERSION: "6.0.3"
  # A1r ③/⑤ 要 import requests / urllib3 才能断言 hook 拦截（后端运行时依赖没有这两库）
  REQUESTS_VERSION: "2.34.2"
  URLLIB3_VERSION: "2.8.0"
  TIMESCALE_IMAGE: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
  REDIS_IMAGE: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f

jobs:
name: ci
true:
  push:
    branches:
    - main
  pull_request: null
  merge_group:
    types:
    - checks_requested
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MAIRUI_BASE_URL: http://127.0.0.1:9
  MAIRUI_PRO_BASE_URL: http://127.0.0.1:9
  UV_VERSION: 0.13.6
  UV_PYTHON: '3.13'
  UV_PYTHON_DOWNLOADS: automatic
  PYTEST_COV_VERSION: 7.1.0
  PIP_AUDIT_VERSION: 2.10.1
  SCHEMATHESIS_VERSION: 4.33.0
  PYYAML_VERSION: 6.0.3
  REQUESTS_VERSION: 2.34.2
  URLLIB3_VERSION: 2.8.0
  TIMESCALE_IMAGE: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
  REDIS_IMAGE: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
jobs:
  coverage-base:
    name: trusted main coverage readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: 等待原 main push 的精确测量归档
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/coverage_ratchet_base.py --wait-for-main-seconds 1800 --output "${RUNNER_TEMP}/coverage-base-ready.json"
  backend-a:
    name: 'backend-a (pytest shard: api_app + replay)'
    runs-on: ubuntu-24.04
    permissions: &id001
      contents: read
      actions: read
    timeout-minutes: 60
    services: &id002
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TT41_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/aia
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: aia
      PGPASSWORD: ci-only
      TB116D_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/o67_selfcheck
      MAIRUI_MODE: replay
      AIA_SHARD_DIRS: tests/backend/api_app tests/replay
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: 绑定本 run 的私有回执与浏览器路径
      run: 'set -euo pipefail

        printf ''AIA_CI_UNIX_RECEIPT=%s/o-ci1-a-res/resources.json\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''P2N10_ARTIFACTS=%s/o-ci1-a-res/artifacts\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''PLAYWRIGHT_BROWSERS_PATH=%s/o-ci1-a-browsers\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''AIA_CI_FAILURE_TRACE=%s/o-ci1-a-res/failures.jsonl\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''AIA_CI_TEMPLATE_RECEIPT=%s/o-ci1-a-templates/resources.json\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        cache-dependency-glob: src/backend/uv.lock
        enable-cache: true
        version: ${{ env.UV_VERSION }}
    - name: uv sync --frozen
      run: uv sync --frozen
      working-directory: src/backend
    - name: ruff check
      run: uv run --frozen ruff check --output-format=github .
      working-directory: src/backend
    - name: mypy --strict
      run: uv run --frozen mypy
      working-directory: src/backend
    - name: 迁移到 head（供 TT41_DATABASE_URL / t_t41·t_t45）
      run: uv run --frozen alembic upgrade head
      working-directory: src/backend
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      name: 准备独立 0030 模板与 head 自检库（仅本次服务）
      run: bash scripts/ci/prepare_tt50_template.sh
    - name: 预拉 A32 用例所需镜像（--pull never）
      run: 'set -euo pipefail

        docker pull "${TIMESCALE_IMAGE}"

        docker tag "${TIMESCALE_IMAGE}" timescale/timescaledb:2.31.0-pg16

        docker pull "${REDIS_IMAGE}"

        docker tag "${REDIS_IMAGE}" redis:7.4.12-alpine

        '
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: src/frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        cache: pnpm
        cache-dependency-path: src/frontend/pnpm-lock.yaml
        node-version: '22'
    - name: 准备 P2N10 桌面原例的锁定依赖与 Chromium
      run: 'set -euo pipefail

        pnpm install --frozen-lockfile

        pnpm exec playwright install --with-deps chromium

        # Original tests resolve Vite and Playwright from the repository root.

        test ! -e ../../node_modules && test ! -L ../../node_modules

        ln -s src/frontend/node_modules ../../node_modules

        test -f ../../node_modules/playwright/cli.js

        node -e ''require.resolve("playwright"); require.resolve("vite")''

        '
      working-directory: src/frontend
    - name: 创建并核对本 run 专属 Unix 测试资源
      run: 'set -euo pipefail

        py=src/backend/.venv/bin/python

        "$py" scripts/ci/owned_unix_resources.py plan

        "$py" scripts/ci/owned_unix_resources.py apply --receipt "$AIA_CI_UNIX_RECEIPT"

        "$py" scripts/ci/owned_unix_resources.py check --receipt "$AIA_CI_UNIX_RECEIPT"

        '
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      name: pytest 分片
      run: "set -euo pipefail\npy=src/backend/.venv/bin/python\n# Observe metadata only; preserve pytest argv (plus durations) and exit.\n\"$py\" scripts/ci/observe_template_connections.py &\ntemplate_observer_pid=$!\nstop_template_observer() {\n  if jobs -pr | grep -qx \"$template_observer_pid\"; then\n    kill -TERM \"$template_observer_pid\" || true\n  fi\n  wait \"$template_observer_pid\" || true\n}\ntrap stop_template_observer EXIT\nif [ -f tests/requirements.txt ]; then\n  uv pip install --python \"$py\" -r tests/requirements.txt \"pytest-cov==${PYTEST_COV_VERSION}\"\nelse\n  uv pip install --python \"$py\" \"pytest-cov==${PYTEST_COV_VERSION}\"\nfi\n# A1r 正式例 ③/⑤（__import__('requests')、urllib3.PoolManager）需要这两库在测试环境里\nuv pip install --python \"$py\" \"requests==${REQUESTS_VERSION}\" \"urllib3==${URLLIB3_VERSION}\"\nini=()\n[ -f tests/pytest.ini ] && ini=(-c tests/pytest.ini)\nPYTHONPATH=src/backend \"$py\" -m pytest -p scripts.ci.pytest_safe_failures \"${ini[@]}\" ${AIA_SHARD_DIRS} \\\n  --durations=30 --durations-min=0.5 \\\n  --cov=src/backend/app --cov-report=term-missing:skip-covered \\\n  --cov-report=\"json:${RUNNER_TEMP}/coverage-a.json\" \\\n  --junitxml=${RUNNER_TEMP}/backend-pytest-a.xml\n"
      shell: bash
    - name: 上传分片产物（gate 合并）
      if: ${{ !cancelled() }}
      uses: 'actions/upload-artifact@ea165f8d65b6e75b54044992b4886f43607fa02 # v4.6.2'
      with:
        name: backend-shard-a-${{ github.run_id }}-${{ github.run_attempt }}
        path:
        - ${RUNNER_TEMP}/coverage-a.json
        - ${RUNNER_TEMP}/backend-pytest-a.xml
        if-no-files-found: error
        retention-days: 7
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      if: ${{ always() }}
      name: 正常收尾本 run 新建的 0030 模板与 head 自检库
      run: "set -euo pipefail\nif [ -f \"$AIA_CI_TEMPLATE_RECEIPT\" ]; then\n  bash scripts/ci/prepare_tt50_template.sh cleanup\nfi\n"
    - if: ${{ always() }}
      name: 正常收尾本 run 的精确自有 Unix 资源
      run: "set -euo pipefail\nif [ -f \"$AIA_CI_UNIX_RECEIPT\" ]; then\n  src/backend/.venv/bin/python scripts/ci/owned_unix_resources.py cleanup --receipt \"$AIA_CI_UNIX_RECEIPT\"\nfi\n"
  backend-b:
    name: 'backend-b (pytest shard: unit + integration + milestone + contract + golden)'
    runs-on: ubuntu-24.04
    permissions: *id001
    timeout-minutes: 60
    services: *id002
    env:
      TT41_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/aia
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: aia
      PGPASSWORD: ci-only
      TB116D_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/o67_selfcheck
      MAIRUI_MODE: replay
      AIA_SHARD_DIRS: tests/backend/unit tests/backend/integration tests/backend/milestone tests/backend/contract tests/backend/golden
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: 绑定本 run 的私有回执与浏览器路径
      run: 'set -euo pipefail

        printf ''AIA_CI_UNIX_RECEIPT=%s/o-ci1-b-res/resources.json\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''P2N10_ARTIFACTS=%s/o-ci1-b-res/artifacts\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''PLAYWRIGHT_BROWSERS_PATH=%s/o-ci1-b-browsers\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''AIA_CI_FAILURE_TRACE=%s/o-ci1-b-res/failures.jsonl\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''AIA_CI_TEMPLATE_RECEIPT=%s/o-ci1-b-templates/resources.json\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        cache-dependency-glob: src/backend/uv.lock
        enable-cache: true
        version: ${{ env.UV_VERSION }}
    - name: uv sync --frozen
      run: uv sync --frozen
      working-directory: src/backend
    - name: ruff check
      run: uv run --frozen ruff check --output-format=github .
      working-directory: src/backend
    - name: mypy --strict
      run: uv run --frozen mypy
      working-directory: src/backend
    - name: 迁移到 head（供 TT41_DATABASE_URL / t_t41·t_t45）
      run: uv run --frozen alembic upgrade head
      working-directory: src/backend
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      name: 准备独立 0030 模板与 head 自检库（仅本次服务）
      run: bash scripts/ci/prepare_tt50_template.sh
    - name: 预拉 A32 用例所需镜像（--pull never）
      run: 'set -euo pipefail

        docker pull "${TIMESCALE_IMAGE}"

        docker tag "${TIMESCALE_IMAGE}" timescale/timescaledb:2.31.0-pg16

        docker pull "${REDIS_IMAGE}"

        docker tag "${REDIS_IMAGE}" redis:7.4.12-alpine

        '
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: src/frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        cache: pnpm
        cache-dependency-path: src/frontend/pnpm-lock.yaml
        node-version: '22'
    - name: 准备 P2N10 桌面原例的锁定依赖与 Chromium
      run: 'set -euo pipefail

        pnpm install --frozen-lockfile

        pnpm exec playwright install --with-deps chromium

        # Original tests resolve Vite and Playwright from the repository root.

        test ! -e ../../node_modules && test ! -L ../../node_modules

        ln -s src/frontend/node_modules ../../node_modules

        test -f ../../node_modules/playwright/cli.js

        node -e ''require.resolve("playwright"); require.resolve("vite")''

        '
      working-directory: src/frontend
    - name: 创建并核对本 run 专属 Unix 测试资源
      run: 'set -euo pipefail

        py=src/backend/.venv/bin/python

        "$py" scripts/ci/owned_unix_resources.py plan

        "$py" scripts/ci/owned_unix_resources.py apply --receipt "$AIA_CI_UNIX_RECEIPT"

        "$py" scripts/ci/owned_unix_resources.py check --receipt "$AIA_CI_UNIX_RECEIPT"

        '
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      name: pytest 分片
      run: "set -euo pipefail\npy=src/backend/.venv/bin/python\n# Observe metadata only; preserve pytest argv (plus durations) and exit.\n\"$py\" scripts/ci/observe_template_connections.py &\ntemplate_observer_pid=$!\nstop_template_observer() {\n  if jobs -pr | grep -qx \"$template_observer_pid\"; then\n    kill -TERM \"$template_observer_pid\" || true\n  fi\n  wait \"$template_observer_pid\" || true\n}\ntrap stop_template_observer EXIT\nif [ -f tests/requirements.txt ]; then\n  uv pip install --python \"$py\" -r tests/requirements.txt \"pytest-cov==${PYTEST_COV_VERSION}\"\nelse\n  uv pip install --python \"$py\" \"pytest-cov==${PYTEST_COV_VERSION}\"\nfi\n# A1r 正式例 ③/⑤（__import__('requests')、urllib3.PoolManager）需要这两库在测试环境里\nuv pip install --python \"$py\" \"requests==${REQUESTS_VERSION}\" \"urllib3==${URLLIB3_VERSION}\"\nini=()\n[ -f tests/pytest.ini ] && ini=(-c tests/pytest.ini)\nPYTHONPATH=src/backend \"$py\" -m pytest -p scripts.ci.pytest_safe_failures \"${ini[@]}\" ${AIA_SHARD_DIRS} \\\n  --durations=30 --durations-min=0.5 \\\n  --cov=src/backend/app --cov-report=term-missing:skip-covered \\\n  --cov-report=\"json:${RUNNER_TEMP}/coverage-b.json\" \\\n  --junitxml=${RUNNER_TEMP}/backend-pytest-b.xml\n"
      shell: bash
    - if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
      name: 后端自检 A1s/A1r/A28–A31（A32 在 tb90，正式例已覆盖）
      run: "set -euo pipefail\npy=src/backend/.venv/bin/python\nPYTHONPATH=src/backend \"$py\" -m pytest -c tests/pytest.ini \\\n  src/backend/selfchecks/test_tb116d_a1s_static.py \\\n  src/backend/selfchecks/test_tb116d_a1r_runtime.py \\\n  src/backend/selfchecks/test_tb116d_a28_a32.py \\\n  --junitxml=\"${RUNNER_TEMP}/selfcheck-a1s-a32.xml\"\n"
      shell: bash
    - name: 上传分片产物（gate 合并）
      if: ${{ !cancelled() }}
      uses: 'actions/upload-artifact@ea165f8d65b6e75b54044992b4886f43607fa02 # v4.6.2'
      with:
        name: backend-shard-b-${{ github.run_id }}-${{ github.run_attempt }}
        path:
        - ${RUNNER_TEMP}/coverage-b.json
        - ${RUNNER_TEMP}/backend-pytest-b.xml
        - ${{ runner.temp }}/selfcheck-a1s-a32.xml
        if-no-files-found: error
        retention-days: 7
    - env:
        AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
      if: ${{ always() }}
      name: 正常收尾本 run 新建的 0030 模板与 head 自检库
      run: "set -euo pipefail\nif [ -f \"$AIA_CI_TEMPLATE_RECEIPT\" ]; then\n  bash scripts/ci/prepare_tt50_template.sh cleanup\nfi\n"
    - if: ${{ always() }}
      name: 正常收尾本 run 的精确自有 Unix 资源
      run: "set -euo pipefail\nif [ -f \"$AIA_CI_UNIX_RECEIPT\" ]; then\n  src/backend/.venv/bin/python scripts/ci/owned_unix_resources.py cleanup --receipt \"$AIA_CI_UNIX_RECEIPT\"\nfi\n"
  backend-gate:
    name: backend (merge shards, ratchet, archive)
    needs:
    - backend-a
    - backend-b
    runs-on: ubuntu-24.04
    permissions: *id001
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: 下载分片产物
      uses: 'actions/download-artifact@636f71bd93d13d047c6745fcfe2b7f70679b8ece # v5.0.1'
      with:
        pattern: backend-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: shards
    - name: 合并分片覆盖率与 JUnit
      run: 'set -euo pipefail

        python3 scripts/ci/merge_shard_coverage.py shards/backend-shard-a-*/coverage-a.json shards/backend-shard-b-*/coverage-b.json --output "${RUNNER_TEMP}/coverage.json"

        python3 scripts/ci/merge_shard_junit.py shards/backend-shard-a-*/backend-pytest-a.xml shards/backend-shard-b-*/backend-pytest-b.xml --output "${RUNNER_TEMP}/backend-pytest.xml"

        cp shards/backend-shard-b-*/selfcheck-a1s-a32.xml "${RUNNER_TEMP}/selfcheck-a1s-a32.xml"'
    - if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
      name: 确认 A1s–A32 与 t_t41 已执行（未因缺库 skip）
      run: python3 scripts/ci/assert_a1s_a32_ran.py "${RUNNER_TEMP}/backend-pytest.xml"
    - env:
        GH_TOKEN: ${{ github.token }}
      if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
      name: 冻结可信 base 覆盖率棘轮基线
      run: python3 scripts/ci/coverage_ratchet_base.py --wait-for-main-seconds 1800 --output "${RUNNER_TEMP}/coverage-base.json"
    - id: coverage_ratchet
      if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
      name: 精确覆盖率棘轮（可信 base，不下降）
      run: "test -f \"${RUNNER_TEMP}/coverage.json\" || { echo \"::error title=coverage::没有 coverage.json（pytest 未运行）\"; exit 1; }\npython3 scripts/ci/check_coverage.py \"${RUNNER_TEMP}/coverage.json\" \\\n  --base \"${RUNNER_TEMP}/coverage-base.json\" \\\n  --policy scripts/ci/coverage-baseline.json \\\n  --output \"${RUNNER_TEMP}/coverage-ratchet-measurement.json\"\n"
    - if: ${{ !cancelled() && steps.coverage_ratchet.outcome == 'success' }}
      name: 归档可信覆盖率测量与原始 JSON/JUnit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: error
        name: coverage-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/coverage-ratchet-measurement.json

          ${{ runner.temp }}/coverage.json

          ${{ runner.temp }}/backend-pytest.xml

          ${{ runner.temp }}/selfcheck-a1s-a32.xml

          '
        retention-days: 90
  frontend:
    name: frontend (eslint, tsc, vitest, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 检测前端工程
      id: detect
      shell: bash
      run: "set -euo pipefail\nif [ ! -f src/frontend/package.json ]; then\n  echo \"::notice title=frontend::src/frontend/package.json 不存在（前端工程尚未提交），前端 job 跳过\"\n  echo \"present=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\necho \"present=true\" >> \"$GITHUB_OUTPUT\"\nif [ ! -f src/frontend/pnpm-lock.yaml ]; then\n  echo \"::error title=frontend::src/frontend 有 package.json 但没有 pnpm-lock.yaml——前端必须用 pnpm 并提交锁文件（不接受 package-lock.json）\"\n  exit 1\nfi\n"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      if: steps.detect.outputs.present == 'true'
      with:
        package_json_file: src/frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: steps.detect.outputs.present == 'true'
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: src/frontend/pnpm-lock.yaml
    - name: pnpm install --frozen-lockfile
      id: install
      if: steps.detect.outputs.present == 'true'
      working-directory: src/frontend
      run: pnpm install --frozen-lockfile
    - name: eslint
      if: steps.detect.outputs.present == 'true'
      working-directory: src/frontend
      run: pnpm exec eslint . --max-warnings=0
    - name: tsc --noEmit
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: src/frontend
      shell: bash
      run: "if node -e 'process.exit(require(\"./package.json\").scripts?.typecheck ? 0 : 1)'; then\n  pnpm run typecheck\nelse\n  pnpm exec tsc --noEmit\nfi\n"
    - name: vitest
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: src/frontend
      run: pnpm exec vitest run
    - name: pnpm audit
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: src/frontend
      run: pnpm audit --audit-level high
    - name: AG Grid Enterprise（已安装依赖）
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python3 scripts/ci/check_licenses.py --node-modules src/frontend/node_modules
    - name: tests/ 下的 vitest（测试角色）
      if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('tests/package.json') != '' }}
      working-directory: tests
      shell: bash
      run: 'if [ ! -f pnpm-lock.yaml ]; then echo "::error title=tests vitest::tests/package.json 没有 pnpm-lock.yaml"; exit 1; fi

        pnpm install --frozen-lockfile

        pnpm exec vitest run

        '
  contract:
    name: contract (doc check, code namespaces, schemathesis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: src/backend/uv.lock
    - name: 契约文档静态检查（§4.1 = plan 3.5A-1、码表计数）
      run: python3 scripts/ci/check_contract.py
    - name: 三类码不得重名（契约文档）
      if: ${{ !cancelled() }}
      run: python3 scripts/ci/check_code_namespaces.py
    - name: uv sync --frozen
      if: ${{ !cancelled() }}
      working-directory: src/backend
      run: uv sync --frozen
    - name: 导出 /meta/enums
      id: meta
      if: ${{ !cancelled() }}
      working-directory: src/backend
      run: .venv/bin/python ../../scripts/ci/dump_meta_enums.py "${RUNNER_TEMP}/meta.json"
    - name: /meta/enums 与契约一致
      if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
      run: python3 scripts/ci/check_contract.py --meta-json "${RUNNER_TEMP}/meta.json"
    - name: 三类码不得重名（后端实现）
      if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
      run: python3 scripts/ci/check_code_namespaces.py --meta-json "${RUNNER_TEMP}/meta.json"
    - name: 迁移到 head（schemathesis 需要库表）
      id: migrate
      if: ${{ !cancelled() && hashFiles('src/backend/alembic.ini') != '' }}
      working-directory: src/backend
      run: .venv/bin/alembic upgrade head
    - name: schemathesis（OpenAPI /api/v1/openapi.json）
      if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
      working-directory: src/backend
      shell: bash
      run: "set -euo pipefail\n.venv/bin/uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > \"${RUNNER_TEMP}/api.log\" 2>&1 &\npid=$!\ntrap 'kill $pid 2>/dev/null || true' EXIT\nfor _ in $(seq 1 60); do\n  curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null 2>&1 && break\n  sleep 1\ndone\ncurl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null || { cat \"${RUNNER_TEMP}/api.log\"; exit 1; }\nuvx --from \"schemathesis==${SCHEMATHESIS_VERSION}\" schemathesis run \\\n  http://127.0.0.1:8000/api/v1/openapi.json \\\n  --checks all --max-examples 50 --seed 20261101 --no-color \\\n  || { echo \"--- api log (tail)\"; tail -n 100 \"${RUNNER_TEMP}/api.log\"; exit 1; }\n"
  migrations:
    name: migrations (alembic up/down/up)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 检测 alembic.ini
      id: detect
      run: 'if [ -f src/backend/alembic.ini ]; then echo "present=true" >> "$GITHUB_OUTPUT"

        else echo "::notice title=migrations::src/backend/alembic.ini 不存在，跳过迁移检查"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

        '
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      if: steps.detect.outputs.present == 'true'
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: src/backend/uv.lock
    - name: upgrade head → downgrade base → upgrade head
      if: steps.detect.outputs.present == 'true'
      working-directory: src/backend
      run: 'set -euo pipefail

        uv sync --frozen

        .venv/bin/alembic upgrade head

        .venv/bin/alembic downgrade base

        .venv/bin/alembic upgrade head

        .venv/bin/alembic check

        '
    - name: 分库角色与列级授权（db-roles 幂等两次 + 验收：api 读 ciphertext 被拒）
      if: steps.detect.outputs.present == 'true'
      env:
        PGHOST: 127.0.0.1
        PGPORT: '5432'
        PGUSER: aia
        PGPASSWORD: ci-only
        PGDATABASE: aia
      run: 'set -euo pipefail

        export AIA_DB_ROLE_PASSWORD_DIR="$RUNNER_TEMP/db-roles"

        bash deploy/scripts/db-role-passwords.sh "$AIA_DB_ROLE_PASSWORD_DIR"

        bash deploy/db/roles/apply-roles.sh

        bash deploy/db/roles/apply-roles.sh

        bash deploy/db/roles/verify-roles.sh

        '
  image:
    name: image (backend.Dockerfile, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: docker build（push=false）
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: src/backend
        file: deploy/docker/backend.Dockerfile
        push: false
        load: true
        tags: aia-backend:ci
        provenance: false
    - name: 冒烟：/api/v1/health/live
      shell: bash
      run: "set -euo pipefail\ndocker run -d --name aia-api-smoke -e APP_ENV=test -v \"$PWD/config:/app/config:ro\" -p 8000:8000 aia-backend:ci\nfor _ in $(seq 1 30); do\n  curl -fsS http://127.0.0.1:8000/api/v1/health/live && exit 0\n  sleep 1\ndone\ndocker logs aia-api-smoke\nexit 1\n"
    - name: 清理
      if: always()
      run: docker rm -f aia-api-smoke || true
  frontend-image:
    name: frontend-image (frontend.Dockerfile, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: docker build（push=false）
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: src/frontend
        file: deploy/docker/frontend.Dockerfile
        push: false
        load: true
        tags: aia-frontend:ci
        provenance: false
    - name: SPA / 深链 / 静态资源 / /api 未登录
      shell: bash
      run: AIA_FRONTEND_IMAGE=aia-frontend:ci bash scripts/ci/frontend_gateway_smoke.sh image
    - name: 静态规则
