# CI 质量门禁（plan.md §8.0、T-O02）。密钥与敏感信息扫描在 secret-scan.yml（T-O02a）。
# 所有第三方 action 按提交 SHA 固定（注释为对应版本）。
# CI 不访问真实麦蕊与真实 LLM：不配置麦蕊证书 / DEEPSEEK_API_KEY，不引用任何 secret，一律用 mock 或录制数据。
# 兜底：麦蕊基址指向本机不可达端口，万一有代码误发请求也只会连接失败，不会到达公网（scripts/ci/tests 有检查）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue requests must neither share PR groups nor replace pending queue runs.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAIRUI_BASE_URL: "http://127.0.0.1:9"
  MAIRUI_PRO_BASE_URL: "http://127.0.0.1:9"
  UV_VERSION: "0.13.6"
  UV_PYTHON: "3.13"
  UV_PYTHON_DOWNLOADS: automatic
  PYTEST_COV_VERSION: "7.1.0"
  PIP_AUDIT_VERSION: "2.10.1"
  SCHEMATHESIS_VERSION: "4.33.0"
  PYYAML_VERSION: "6.0.3"
  # A1r ③/⑤ 要 import requests / urllib3 才能断言 hook 拦截（后端运行时依赖没有这两库）
  REQUESTS_VERSION: "2.34.2"
  URLLIB3_VERSION: "2.8.0"
  TIMESCALE_IMAGE: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
  REDIS_IMAGE: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f

jobs:
  # Only PRs need a diff; every other event keeps full CI.
  changes:
    name: classify docs-only PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify PR paths
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # pull_request 工作流文件本身来自 PR；改 .github/ 会被分类为非文档。
        # 分类程序只取事件给定的可信 base 版本，在 PR 工作树外保存并隔离执行。
        run: |
          set -euo pipefail
          classifier_dir=$(mktemp -d "$RUNNER_TEMP/docs-only.XXXXXX")
          trap 'rm -rf "$classifier_dir"' EXIT
          docs_only=false
          if ! git show "$BASE_SHA:scripts/ci/docs_only_paths.py" > "$classifier_dir/classifier.py"; then
            echo '::notice::Base classifier unavailable; running full CI.'
          elif ! python3 -I "$classifier_dir/classifier.py" "$BASE_SHA" "$HEAD_SHA" > "$classifier_dir/output"; then
            echo '::warning::Base classifier failed; running full CI.'
          elif cmp -s "$classifier_dir/output" <(printf 'docs_only=true\n'); then
            docs_only=true
          elif ! cmp -s "$classifier_dir/output" <(printf 'docs_only=false\n'); then
            echo '::warning::Invalid classifier output; running full CI.'
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  # Wait only for an already-running exact-main push, in parallel with backend.
  # Retain this required readiness check; never run another measurement.
  # PR and merge_group both require their exact main base, without fallback.
  coverage-base:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: trusted main coverage readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 等待原 main push 的精确测量归档
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/coverage_ratchet_base.py --wait-for-main-seconds 1800 --output "${RUNNER_TEMP}/coverage-base-ready.json" --coverage-output "${RUNNER_TEMP}/coverage-base-ready-coverage.json"

  # ------------------------------------------------------------------ 后端：lint / pytest 分片 / 覆盖率汇总
  backend-lint:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: backend-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: uv sync --frozen
        working-directory: src/backend
        run: uv sync --frozen
      - name: ruff check
        working-directory: src/backend
        run: uv run --frozen ruff check --output-format=github .
      - name: mypy --strict
        working-directory: src/backend
        run: uv run --frozen mypy

  backend-shard:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: backend-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read
      actions: read
    # T-O120：按文件 LPT 分 6 片，每片独立 PG/端口/Unix 资源，serial 组在片内仍顺序执行。
    # T-O66：t_t41 / t_t45 读 TT41_DATABASE_URL；T-O67：A2–A31 读 PGHOST 等，均指向本 job 内建 PG（ci-only）。
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI 专用口令（与 contract/migrations 一致），不是真实密钥；驱动用 psycopg 与用例注释一致。
      TT41_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/aia
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
      # T-O67：正式 A2–A31 读 PGHOST/PGPORT/PGUSER（缺则 skip）；口令走 PGPASSWORD / libpq，不进测试源码 URL。
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: aia
      PGPASSWORD: ci-only
      # 后端自检 A28–A31（独立库，由 prepare_tt50_template.py 创建）
      TB116D_DATABASE_URL: postgresql+psycopg://aia:ci-only@127.0.0.1:5432/o67_selfcheck
      MAIRUI_MODE: replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 绑定本 run 的私有回执与浏览器路径
        run: |
          set -euo pipefail
          printf 'AIA_CI_UNIX_RECEIPT=%s/o-ci1-res/resources.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'P2N10_ARTIFACTS=%s/o-ci1-res/artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/o-ci1-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'AIA_CI_FAILURE_TRACE=%s/o-ci1-res/failures.jsonl\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'AIA_CI_TEMPLATE_RECEIPT=%s/o-ci1-templates/resources.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: uv sync --frozen
        working-directory: src/backend
        run: uv sync --frozen
      - name: 迁移到 head（供 TT41_DATABASE_URL / t_t41·t_t45）
        working-directory: src/backend
        run: uv run --frozen alembic upgrade head
      - name: 准备独立 0030 模板与 head 自检库（仅本次服务）
        env:
          AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
        run: bash scripts/ci/prepare_tt50_template.sh
      - name: 预拉 A32 用例所需镜像（--pull never）
        run: |
          set -euo pipefail
          docker pull "${TIMESCALE_IMAGE}"
          docker tag "${TIMESCALE_IMAGE}" timescale/timescaledb:2.31.0-pg16
          docker pull "${REDIS_IMAGE}"
          docker tag "${REDIS_IMAGE}" redis:7.4.12-alpine
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: 准备 P2N10 桌面原例的锁定依赖与 Chromium
        working-directory: src/frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          # Original tests resolve Vite and Playwright from the repository root.
          test ! -e ../../node_modules && test ! -L ../../node_modules
          ln -s src/frontend/node_modules ../../node_modules
          test -f ../../node_modules/playwright/cli.js
          node -e 'require.resolve("playwright"); require.resolve("vite")'
      - name: 创建并核对本 run 专属 Unix 测试资源
        run: |
          set -euo pipefail
          py=src/backend/.venv/bin/python
          "$py" scripts/ci/owned_unix_resources.py plan
          "$py" scripts/ci/owned_unix_resources.py apply --receipt "$AIA_CI_UNIX_RECEIPT"
          "$py" scripts/ci/owned_unix_resources.py check --receipt "$AIA_CI_UNIX_RECEIPT"
      - name: pytest + 覆盖率
        shell: bash
        env:
          AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          py=src/backend/.venv/bin/python
          mkdir -p "$RUNNER_TEMP/cov"
          # Observe metadata only; preserve pytest argv (plus durations) and exit.
          "$py" scripts/ci/observe_template_connections.py &
          template_observer_pid=$!
          stop_template_observer() {
            if jobs -pr | grep -qx "$template_observer_pid"; then
              kill -TERM "$template_observer_pid" || true
            fi
            wait "$template_observer_pid" || true
          }
          trap stop_template_observer EXIT
          if [ -f tests/requirements.txt ]; then
            uv pip install --python "$py" -r tests/requirements.txt "pytest-cov==${PYTEST_COV_VERSION}"
          else
            uv pip install --python "$py" "pytest-cov==${PYTEST_COV_VERSION}"
          fi
          # A1r 正式例 ③/⑤（__import__('requests')、urllib3.PoolManager）需要这两库在测试环境里
          uv pip install --python "$py" "requests==${REQUESTS_VERSION}" "urllib3==${URLLIB3_VERSION}"
          mapfile -t test_files < <(python3 scripts/ci/shard_backend_tests.py --shards 6 --index "${{ matrix.shard }}")
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error title=backend tests::分片没有测试文件"
            exit 1
          fi
          ini=()
          [ -f tests/pytest.ini ] && ini=(-c tests/pytest.ini)
          COVERAGE_FILE="$RUNNER_TEMP/cov/.coverage.shard${{ matrix.shard }}" \
            PYTHONPATH=src/backend "$py" -m pytest -p scripts.ci.pytest_safe_failures \
            "${ini[@]}" "${test_files[@]}" \
            --durations=30 --durations-min=0.5 \
            --cov=src/backend/app --cov-report= \
            --junitxml="$RUNNER_TEMP/cov/backend-pytest-shard${{ matrix.shard }}.xml"
      - name: 后端自检 A1s/A1r/A28–A31（A32 在 tb90，正式例已覆盖）
        if: ${{ matrix.shard == 0 && !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          py=src/backend/.venv/bin/python
          PYTHONPATH=src/backend "$py" -m pytest -c tests/pytest.ini \
            src/backend/selfchecks/test_tb116d_a1s_static.py \
            src/backend/selfchecks/test_tb116d_a1r_runtime.py \
            src/backend/selfchecks/test_tb116d_a28_a32.py \
            --junitxml="$RUNNER_TEMP/cov/selfcheck-a1s-a32.xml"
      - name: 上传后端分片测量
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 正常收尾本 run 新建的 0030 模板与 head 自检库
        if: ${{ always() }}
        env:
          AIA_CI_PG_SERVICE_ID: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          if [ -f "$AIA_CI_TEMPLATE_RECEIPT" ]; then
            bash scripts/ci/prepare_tt50_template.sh cleanup
          fi
      - name: 正常收尾本 run 的精确自有 Unix 资源
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$AIA_CI_UNIX_RECEIPT" ]; then
            src/backend/.venv/bin/python scripts/ci/owned_unix_resources.py cleanup --receipt "$AIA_CI_UNIX_RECEIPT"
          fi

  # 汇总 job 保留原 backend 检查名，作为唯一覆盖率与 JUnit 检查入口。
  backend:
    needs: [changes, backend-lint, backend-shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') }}
    name: backend (ruff, mypy, pytest+coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: 确认 backend-lint 与 backend-shard 成功
        run: |
          set -euo pipefail
          if [ "${{ needs.backend-lint.result }}" != "success" ] ||
             [ "${{ needs.backend-shard.result }}" != "success" ]; then
            echo "::error title=backend::backend-lint 或 backend-shard 未成功"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: uv sync --frozen
        working-directory: src/backend
        run: uv sync --frozen
      - name: 安装 pytest-cov
        run: uv pip install --python src/backend/.venv/bin/python "pytest-cov==${PYTEST_COV_VERSION}"
      - name: 检查后端分片规划
        run: python3 scripts/ci/shard_backend_tests.py --shards 6 --check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backend-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/cov
      - name: 合并覆盖率
        shell: bash
        run: |
          set -euo pipefail
          test -x src/backend/.venv/bin/coverage
          COVERAGE_FILE="$RUNNER_TEMP/cov/.coverage" src/backend/.venv/bin/coverage combine "$RUNNER_TEMP/cov"
          COVERAGE_FILE="$RUNNER_TEMP/cov/.coverage" src/backend/.venv/bin/coverage json -o "$RUNNER_TEMP/coverage.json"
          COVERAGE_FILE="$RUNNER_TEMP/cov/.coverage" src/backend/.venv/bin/coverage report --skip-covered -m
      - name: 合并后端 JUnit
        run: |
          set -euo pipefail
          mapfile -d '' junit_files < <(find "$RUNNER_TEMP/cov" -type f -name 'backend-pytest-shard*.xml' -print0)
          if [ "${#junit_files[@]}" -eq 0 ]; then
            echo "::error title=backend junit::没有找到分片 JUnit"
            exit 1
          fi
          python3 scripts/ci/merge_junit.py --output "$RUNNER_TEMP/backend-pytest.xml" \
            "${junit_files[@]}"
          selfcheck=$(find "$RUNNER_TEMP/cov" -type f -name 'selfcheck-a1s-a32.xml' -print -quit)
          test -n "$selfcheck"
          cp "$selfcheck" "$RUNNER_TEMP/selfcheck-a1s-a32.xml"
      - name: 确认 A1s–A32 与 t_t41 已执行（未因缺库 skip）
        if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
        run: python3 scripts/ci/assert_a1s_a32_ran.py "${RUNNER_TEMP}/backend-pytest.xml"
      - name: 冻结可信 base 覆盖率棘轮基线
        if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/coverage_ratchet_base.py --wait-for-main-seconds 1800 --output "${RUNNER_TEMP}/coverage-base.json" --coverage-output "${RUNNER_TEMP}/coverage-base-coverage.json"
      - name: 精确覆盖率棘轮（可信 base，不下降）
        id: coverage_ratchet
        if: ${{ !cancelled() && hashFiles('src/backend/.venv/bin/python') != '' }}
        run: |
          test -f "${RUNNER_TEMP}/coverage.json" || { echo "::error title=coverage::没有 coverage.json（pytest 未运行）"; exit 1; }
          python3 scripts/ci/check_coverage.py "${RUNNER_TEMP}/coverage.json" \
            --base "${RUNNER_TEMP}/coverage-base.json" \
            --base-coverage "${RUNNER_TEMP}/coverage-base-coverage.json" \
            --nondet-lines scripts/ci/coverage-nondet-lines.json \
            --policy scripts/ci/coverage-baseline.json \
            --output "${RUNNER_TEMP}/coverage-ratchet-measurement.json"
      - name: 归档可信覆盖率测量与原始 JSON/JUnit
        if: ${{ !cancelled() && steps.coverage_ratchet.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coverage-ratchet-measurement.json
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/backend-pytest.xml
            ${{ runner.temp }}/selfcheck-a1s-a32.xml
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------ 前端：eslint / tsc / vitest / pnpm audit
  frontend:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: frontend (eslint, tsc, vitest, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检测前端工程
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/frontend/package.json ]; then
            echo "::notice title=frontend::src/frontend/package.json 不存在（前端工程尚未提交），前端 job 跳过"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          if [ ! -f src/frontend/pnpm-lock.yaml ]; then
            echo "::error title=frontend::src/frontend 有 package.json 但没有 pnpm-lock.yaml——前端必须用 pnpm 并提交锁文件（不接受 package-lock.json）"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        id: install
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile
      - name: eslint
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        run: pnpm exec eslint . --max-warnings=0
      - name: tsc --noEmit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src/frontend
        shell: bash
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.typecheck ? 0 : 1)'; then
            pnpm run typecheck
          else
            pnpm exec tsc --noEmit
          fi
      - name: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src/frontend
        run: pnpm exec vitest run
      - name: pnpm audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src/frontend
        shell: bash
        # 审计完整开发/生产依赖的 high/critical；不做公告、版本或路径豁免。
        run: |
          set +e
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/frontend-audit.json"
          audit_status=$?
          set -e
          python3 ../../scripts/ci/frontend_audit.py --report "$RUNNER_TEMP/frontend-audit.json" --audit-exit "$audit_status"
      - name: AG Grid Enterprise（已安装依赖）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/ci/check_licenses.py --node-modules src/frontend/node_modules
      - name: tests/ 下的 vitest（测试角色）
        if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('tests/package.json') != '' }}
        working-directory: tests
        shell: bash
        run: |
          if [ ! -f pnpm-lock.yaml ]; then echo "::error title=tests vitest::tests/package.json 没有 pnpm-lock.yaml"; exit 1; fi
          pnpm install --frozen-lockfile
          pnpm exec vitest run

  # ------------------------------------------------------------------ 契约：文档对照脚本 + 三类码不得重名 + schemathesis
  contract:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: contract (doc check, code namespaces, schemathesis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: 契约文档静态检查（§4.1 = plan 3.5A-1、码表计数）
        run: python3 scripts/ci/check_contract.py
      - name: 三类码不得重名（契约文档）
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_code_namespaces.py
      - name: uv sync --frozen
        if: ${{ !cancelled() }}
        working-directory: src/backend
        run: uv sync --frozen
      - name: 导出 /meta/enums
        id: meta
        if: ${{ !cancelled() }}
        working-directory: src/backend
        run: .venv/bin/python ../../scripts/ci/dump_meta_enums.py "${RUNNER_TEMP}/meta.json"
      - name: /meta/enums 与契约一致
        if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
        run: python3 scripts/ci/check_contract.py --meta-json "${RUNNER_TEMP}/meta.json"
      - name: 三类码不得重名（后端实现）
        if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
        run: python3 scripts/ci/check_code_namespaces.py --meta-json "${RUNNER_TEMP}/meta.json"
      - name: 迁移到 head（schemathesis 需要库表）
        id: migrate
        if: ${{ !cancelled() && hashFiles('src/backend/alembic.ini') != '' }}
        working-directory: src/backend
        run: .venv/bin/alembic upgrade head
      - name: schemathesis（OpenAPI /api/v1/openapi.json）
        if: ${{ !cancelled() && steps.meta.outcome == 'success' }}
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/api.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null || { cat "${RUNNER_TEMP}/api.log"; exit 1; }
          uvx --from "schemathesis==${SCHEMATHESIS_VERSION}" schemathesis run \
            http://127.0.0.1:8000/api/v1/openapi.json \
            --checks all --max-examples 50 --seed 20261101 --no-color \
            || { echo "--- api log (tail)"; tail -n 100 "${RUNNER_TEMP}/api.log"; exit 1; }

  # ------------------------------------------------------------------ Alembic 迁移可升可降（plan §8.0）
  migrations:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: migrations (alembic up/down/up)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d aia" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://aia:ci-only@127.0.0.1:5432/aia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检测 alembic.ini
        id: detect
        run: |
          if [ -f src/backend/alembic.ini ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=migrations::src/backend/alembic.ini 不存在，跳过迁移检查"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.detect.outputs.present == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: upgrade head → downgrade base → upgrade head
        if: steps.detect.outputs.present == 'true'
        working-directory: src/backend
        run: |
          set -euo pipefail
          uv sync --frozen
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: 分库角色与列级授权（db-roles 幂等两次 + 验收：api 读 ciphertext 被拒）
        if: steps.detect.outputs.present == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: aia
          PGPASSWORD: ci-only
          PGDATABASE: aia
        run: |
          set -euo pipefail
          export AIA_DB_ROLE_PASSWORD_DIR="$RUNNER_TEMP/db-roles"
          bash deploy/scripts/db-role-passwords.sh "$AIA_DB_ROLE_PASSWORD_DIR"
          bash deploy/db/roles/apply-roles.sh
          bash deploy/db/roles/apply-roles.sh
          bash deploy/db/roles/verify-roles.sh

  # ------------------------------------------------------------------ 镜像构建（只构建不推送）
  image:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: image (backend.Dockerfile, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build（push=false）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/backend
          file: deploy/docker/backend.Dockerfile
          push: false
          load: true
          tags: aia-backend:ci
          provenance: false
      - name: 冒烟：/api/v1/health/live
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name aia-api-smoke -e APP_ENV=test -v "$PWD/config:/app/config:ro" -p 8000:8000 aia-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/live && exit 0
            sleep 1
          done
          docker logs aia-api-smoke
          exit 1
      - name: 清理
        if: always()
        run: docker rm -f aia-api-smoke || true

  # ------------------------------------------------------------------ 前端镜像（只构建不推送；dist 在镜像内，网关配置仍用仓库 nginx.conf）
  frontend-image:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: frontend-image (frontend.Dockerfile, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build（push=false）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/frontend
          file: deploy/docker/frontend.Dockerfile
          push: false
          load: true
          tags: aia-frontend:ci
          provenance: false
      - name: SPA / 深链 / 静态资源 / /api 未登录
        shell: bash
        run: AIA_FRONTEND_IMAGE=aia-frontend:ci bash scripts/ci/frontend_gateway_smoke.sh image
      - name: 静态规则
        run: python3 scripts/ci/check_frontend_deploy.py

  # ------------------------------------------------------------------ 依赖审计
  pip-audit:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: pip-audit（uv.lock 全部依赖组）
        shell: bash
        run: |
          set -euo pipefail
          uv export --project src/backend --frozen --all-groups --no-emit-project --format requirements.txt \
            -o "${RUNNER_TEMP}/backend-requirements.txt"
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict --progress-spinner off \
            -r "${RUNNER_TEMP}/backend-requirements.txt" --require-hashes --disable-pip
          if [ -f tests/requirements.txt ]; then
            uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict --progress-spinner off -r tests/requirements.txt
          fi

  # ------------------------------------------------------------------ 依赖许可
  licenses:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: licenses (no ag-grid-enterprise, no GPL/AGPL/NC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync --frozen
        working-directory: src/backend
        run: uv sync --frozen
      - name: AG Grid Enterprise 与 Python 依赖许可证
        run: python3 scripts/ci/check_licenses.py --python src/backend/.venv/bin/python

  # ------------------------------------------------------------------ 交割单夹具一致性（7.4A 条件 1–5、3.5A-2）
  fixtures:
    name: fixtures (check_fixtures.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: check_fixtures.py
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_fixtures.py

  # 网关上限一致性（T-O03）：nginx client_max_body_size = config/imports.yaml max_request_bytes
  # > max_file_bytes × max_files_per_upload，且 = 413 信封 max_bytes。imports.yaml 不存在时明确失败。
  # T-O10：limit_req 静态规则（zone 键、429 RATE_LIMITED 信封、Retry-After = ceil(1/速率)、dev 只 dry run）
  # + 运行时冒烟（临时 nginx + 桩上游，正例 429 / 反例不误伤 / 413 不被 429 盖住）。
  # T-O13：上游动态解析（resolver 127.0.0.11 + 变量 proxy_pass）、nginx 健康检查探上游 /health/live；
  # 冒烟 upstream 模式：路由/前缀/头不变，桩上游换 IP 后网关不重启即恢复。
  # 正反例在 scripts/ci/tests/test_gateway_limits.py（secret-scan.yml selftest job 运行）。
  gateway-limits:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
    name: gateway-limits (nginx client_max_body_size ↔ config/imports.yaml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: check_gateway_limits.py
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_gateway_limits.py
      - name: nginx 限流运行时冒烟（prod 正反例 + dev dry run）
        run: bash scripts/ci/nginx_limits_smoke.sh both

  # 部署配置的密钥边界（T-A07 §5、T-O09）：部署配置不再有全站麦蕊证书变量；不用 env_file；
  # 证书封装私钥（secret / *_PRIVATE_KEYS 变量 / 私钥挂载）只给 ingest；api 只拿公钥。
  # 正反例在 scripts/ci/tests/test_secret_boundary.py、test_compose_networks.py（secret-scan.yml selftest job 运行）。
  secret-boundary:
    name: secret-boundary (私钥只给 ingest，无全站证书变量)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: check_secret_boundary.py
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_secret_boundary.py
      # 日志轮转（T-A04 ③）：每个 compose 服务都 logging: *default-logging（json-file 10m×5）
      - name: check_compose_logging.py
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_compose_logging.py
      # 网络拆分（T-O68）：非登记服务不得接入 aia_egress / aia_edge；发布端口须走无伪装的 aia_edge
      - name: check_compose_networks.py
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_compose_networks.py
      - name: check_alpine_pin.py
        run: python3 scripts/ci/check_alpine_pin.py

  # 源码不得被 .gitignore 误伤（T-O09a）：已跟踪源码被规则命中、相对引用指向被忽略的文件、
  # 敏感词文件名探针（licence.ts 等）被宽规则命中，都失败。正反例在 scripts/ci/tests/test_ignored_sources.py。
  # 所有 job 都在 actions/checkout 的干净检出上运行；setup-uv / setup-node 的缓存只缓存依赖下载（uv 缓存、pnpm store），
  # 不恢复工作区文件，所以未跟踪文件不会被带进 CI。本地复现同样条件：scripts/ci/clean_check.sh。
  ignored-sources:
    name: ignored-sources (源码不被 .gitignore 误伤)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check_ignored_sources.py
        run: python3 scripts/ci/check_ignored_sources.py

  # 惰性文档 PR：轻检查真跑；以下空跑仅覆盖已审计的不相关输入。
  # 安全：只验证 main 覆盖率制品；惰性文档不改变可执行代码或测量输入。
  coverage-base-docs:
    name: trusted main coverage readiness
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：测试读取的契约/策略等 docs 已列入 CONSUMED_DOCS；其余惰性文档不参与测试。
  backend-docs:
    name: backend (ruff, mypy, pytest+coverage)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：测试读取的契约、plan 和免责策略已排除；构建/依赖输入均在 src/frontend。
  frontend-docs:
    name: frontend (eslint, tsc, vitest, pnpm audit)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  contract-docs:
    name: contract (doc check, code namespaces, schemathesis)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/ci/check_contract.py
          python3 scripts/ci/check_code_namespaces.py

  # 安全：输入为 src/backend 迁移、deploy/db 和配置；不读取惰性文档。
  migrations-docs:
    name: migrations (alembic up/down/up)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：构建上下文 src/backend，仅 COPY 应用/依赖/迁移；不 COPY docs 或根 Markdown。
  image-docs:
    name: image (backend.Dockerfile, no push)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：构建上下文 src/frontend；不 COPY docs 或根 Markdown，冒烟只读部署配置。
  frontend-image-docs:
    name: frontend-image (frontend.Dockerfile, no push)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：仅审计 uv.lock、pyproject 和 tests/requirements.txt；不读取惰性文档。
  pip-audit-docs:
    name: pip-audit
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：仅检查依赖许可元数据与前端依赖清单；不读取惰性文档。
  licenses-docs:
    name: licenses (no ag-grid-enterprise, no GPL/AGPL/NC)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # 安全：只读取 nginx/compose/config 与冒烟脚本；不读取惰性文档。
  gateway-limits-docs:
    name: gateway-limits (nginx client_max_body_size ↔ config/imports.yaml)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0
